sensor_cv_run_root: runs/sensor_cv_all15_d35
region_dataset_root: runs/handcrafted_stat_ablation/_temporary_sliced_datasets/nested_h2

region_training:
  output_root: runs/handcrafted_stat_ablation/receiver_runs/nested_h2
  device: auto
  seed: 42
  n_folds: 3
  representations:
  - handcrafted
  include_average_local_probability: false
  include_mean_logreg: false
  neural_methods:
  - deepsets
  sampling_mode: empirical_fixed_budget
  batch_size: 256
  num_workers: 0
  samples_per_epoch: 6000
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 30
  early_stopping_patience: 6
  minimum_improvement: 0.0001
  gradient_clip_norm: 5.0
  hidden_dim: 32
  phi_hidden_dim: 32
  phi_output_dim: 16
  rho_hidden_dim: 16
  dropout: 0.15
